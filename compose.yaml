services:
  serving:
    image: ${IMAGE}
    ports:
      - "${HOST_PORT}:8000"
    environment:
      MODEL_ID: ${MODEL_ID}
      HF_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped
